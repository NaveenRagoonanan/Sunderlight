<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sunderlight: The Last Beacon of Ondravael</title>
<meta name="description" content="Sunderlight: The Last Beacon of Ondravael. An open-world fantasy role-playing journey across a living land of rivers, mountains, cities and ancient Elder Trees.">
<meta name="theme-color" content="#2a1810">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:dark;--cream:#fff3dc;--parch:#f6e2b8;--honey:#f3b955;--amber:#e08a3c;--rose:#e58f78;--sage:#7fae7b;--wood:#5a3a26;--ink:#3e2414;--bs:1}
*{box-sizing:border-box}
body{padding:0}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1e120a;color:var(--cream);font-family:Georgia,"Palatino Linotype","Book Antiqua",Palatino,serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;margin:0;border:0}
canvas#hud{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:4}
button{font-family:inherit;color:inherit}
#ui{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:safe center;gap:12px;padding:calc(64px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;touch-action:pan-y;background:radial-gradient(ellipse at 50% 0%,rgba(150,84,40,.86),rgba(40,22,12,.95) 72%);text-align:center}
body.ready #ui.title,body.ready #ui.create{background:linear-gradient(rgba(30,14,8,.15),rgba(30,14,8,.72) 70%)}
#ui.card{background:rgba(20,10,6,.5)}#ui.mapbg{padding:0;background:#e8dcbc}#ui.deathbg{background:radial-gradient(ellipse at 50% 40%,rgba(90,10,10,.75),rgba(10,4,4,.96))}
h1{margin:0;font-size:clamp(34px,10vw,58px);letter-spacing:.1em;line-height:1.05;text-shadow:0 2px 0 #7a4a24,0 6px 18px rgba(0,0,0,.55);font-weight:700}
h1.sm{font-size:clamp(26px,7vw,36px);letter-spacing:.06em}
h2{margin:0;font-size:22px;color:var(--honey);letter-spacing:.03em}
h3{margin:12px 0 4px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}
h4{margin:12px 0 2px;color:#7a2d1f}
.logo svg{display:block;margin:0 auto 2px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.tag{margin:6px 0 10px;font-style:italic;letter-spacing:.08em;color:var(--parch);font-size:17px}
.ver,.dim{opacity:.78;font-size:13px;max-width:460px;line-height:1.45;color:var(--parch)}
.col{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.card{all:unset;box-sizing:border-box;width:min(92vw,400px);background:linear-gradient(#ffeccb,#f4c987);color:var(--ink);border:2px solid #c98a45;border-radius:16px;padding:12px 18px;display:grid;gap:3px;text-align:left;box-shadow:0 4px 0 #8a5a30,0 10px 18px rgba(0,0,0,.35);cursor:pointer;font-family:inherit}
.card.c{text-align:center}.card:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5a30}
.card b{font-size:18px}.card small{font-size:13px;opacity:.78;font-style:italic}
.cta{border:2px solid #8a5a30;background:linear-gradient(#ffd98a,#e8a040);color:#3e2414;border-radius:14px;padding:12px 22px;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 3px 0 #8a5a30}
.ghost{border:1px solid rgba(255,243,220,.45);background:rgba(20,10,6,.35);border-radius:12px;padding:10px 16px;cursor:pointer}
#bk{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:30;width:50px;height:50px;border-radius:50%;border:2px solid #c98a45;background:linear-gradient(#ffeccb,#f0c27a);color:#5a3a26;display:none;align-items:center;justify-content:center;box-shadow:0 3px 0 #8a5a30,0 8px 14px rgba(0,0,0,.4);cursor:pointer;padding:0}
/* character creation */
.cc{display:flex;gap:18px;width:min(1000px,100%);align-items:stretch;justify-content:center;flex-wrap:wrap}
.ccl{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 30%,rgba(255,220,160,.18),rgba(30,16,8,.35));border:1px solid rgba(243,185,85,.3);border-radius:22px;padding:10px}
#ccv{width:min(300px,62vw);height:auto;aspect-ratio:360/620}
.ccrot{display:flex;gap:6px;margin-top:4px}.ccrot button,.opts button{border:1px solid rgba(243,185,85,.45);background:rgba(255,236,200,.08);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:14px}
.ccrot button.on,.opts button.on{background:linear-gradient(#ffd98a,#e8a040);color:#3e2414;border-color:#8a5a30}
.ccname{margin:6px 0 0;font-size:18px;color:var(--honey)}
.ccr{flex:1 1 360px;max-width:560px;display:flex;flex-direction:column;gap:8px;text-align:left}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tab{border:none;background:#b5523f;color:#fff1d6;border-radius:8px 8px 0 0;padding:9px 13px;font-weight:600;font-size:13px;letter-spacing:.04em;cursor:pointer;opacity:.72}.tab.on{opacity:1;background:#8e3626}
.ccp{background:rgba(255,236,200,.07);border:1px solid rgba(243,185,85,.28);border-radius:14px;padding:10px 12px;max-height:52vh;overflow-y:auto;touch-action:pan-y}
.races{display:grid;gap:8px}.race{all:unset;cursor:pointer;display:grid;gap:3px;padding:10px 12px;border-radius:12px;border:1px solid rgba(243,185,85,.3);background:rgba(20,10,6,.25)}
.race b{font-size:17px;color:var(--cream)}.race small{font-size:13px;opacity:.85;line-height:1.35}.race em{font-size:12.5px;color:#9fe0a8;font-style:normal}
.race.on{background:linear-gradient(rgba(255,217,138,.28),rgba(224,138,60,.18));border-color:var(--honey)}
.opts{display:flex;flex-wrap:wrap;gap:6px}.sw{display:flex;flex-wrap:wrap;gap:8px}.sw i{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,243,220,.3);cursor:pointer;display:block}.sw i.on{border:3px solid #ffd98a;box-shadow:0 0 0 2px #5a3a22}
.ccp input,#ui input[type=text]{width:100%;padding:10px;border-radius:10px;border:2px solid #8a5a30;background:#fff8e6;color:#3e2414;font:600 18px Georgia,serif;-webkit-user-select:text;user-select:text}
.ccb{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
/* cinematic timeline */
#cin{position:fixed;inset:0;z-index:12;display:none;flex-direction:column;justify-content:flex-end;pointer-events:auto}
#cin .cinbar{position:absolute;left:0;right:0;top:0;height:9vh;background:#000}
.cintl{position:absolute;left:50%;transform:translateX(-50%);top:calc(9vh + 14px);display:flex;gap:min(5vw,34px);align-items:center}
.cintl i{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,243,220,.5);display:block;position:relative}.cintl i.done{background:rgba(243,185,85,.6)}.cintl i.on{background:#ffd98a;box-shadow:0 0 12px #ffb040;transform:scale(1.35)}
.cinbox{margin:0 auto calc(16px + env(safe-area-inset-bottom,0px));width:min(760px,94vw);background:linear-gradient(rgba(30,16,8,.55),rgba(20,10,6,.86));border:1px solid rgba(243,185,85,.35);border-radius:20px;padding:16px 20px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.cinera{font-size:clamp(20px,5vw,30px);font-weight:700;letter-spacing:.08em;color:#ffe9b8}.cinwhen{font-style:italic;color:var(--honey);margin:2px 0 8px;font-size:15px}
.cintext{font-size:clamp(16px,3.6vw,20px);line-height:1.55;min-height:5.2em;margin:0}
.cinbtn{display:flex;gap:10px;justify-content:center;margin-top:10px}.cinbtn button{border:1px solid rgba(255,243,220,.5);background:rgba(255,236,200,.12);border-radius:12px;padding:9px 18px;cursor:pointer}
/* slots */
.slots{display:flex;flex-direction:column;gap:8px;width:min(94vw,620px)}
.slot{display:flex;gap:10px;align-items:center;background:rgba(255,236,200,.08);border:1px solid rgba(243,185,85,.35);border-radius:14px;padding:8px;text-align:left}
.slot img,.slot .thumb{width:112px;height:63px;border-radius:8px;object-fit:cover;background:rgba(0,0,0,.35);flex:none}
.sinfo{flex:1;display:grid;gap:2px;min-width:0}.sinfo b{font-size:16px}.sinfo small{font-size:12px;opacity:.8}
.sbtn{display:flex;flex-direction:column;gap:5px}.sbtn button{border:1px solid #8a5a30;background:linear-gradient(#ffeccb,#f0c27a);color:#3e2414;border-radius:9px;padding:6px 10px;font-size:13px;cursor:pointer}.sbtn button.ghost{background:rgba(20,10,6,.35);color:var(--cream);border-color:rgba(255,243,220,.4)}
.slot.empty{opacity:.7}
/* settings */
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:min(92vw,400px);background:rgba(255,236,200,.08);border:1px solid rgba(243,185,85,.3);border-radius:12px;padding:8px 14px;text-align:left}
.sl span{font-size:15px}.sl em{font-style:normal;color:var(--honey)}.sl input{grid-column:1/3;width:100%;accent-color:#f3b955;height:28px}
/* book */
.book{width:min(96vw,780px);background:#f2dfb6;color:#3a2418;border-radius:10px;border:6px solid #6a4426;box-shadow:0 0 0 2px #3a2414,0 14px 30px rgba(0,0,0,.55);padding:10px;text-align:left}
.book .pg{padding:12px 16px;max-height:66vh;overflow:auto;touch-action:pan-y;line-height:1.5;background:#f8ecce;border:1px solid rgba(90,58,38,.35)}.book .pg h2{color:#7a2d1f}.book .pg .dim{color:#6a4a34;opacity:1}
/* lore card */
.lorecard{width:min(92vw,520px);background:linear-gradient(#f8ecce,#ecd6a8);color:#3a2418;border-radius:18px;border:3px solid #8a5a30;padding:20px 22px;box-shadow:0 18px 40px rgba(0,0,0,.55);text-align:left}
.lorecard small{letter-spacing:.12em;text-transform:uppercase;color:#8e3626;font-size:12px}.lorecard h2{color:#5a2a14;font-size:26px;margin:4px 0 8px}.lorecard p{font-size:17px;line-height:1.55;margin:0 0 10px}.lorecard .help{font-size:14px;color:#6a4a34;font-style:italic}.lorecard .cta{margin-top:6px}
/* map */
.mapwrap{position:fixed;inset:0}#mapc{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.maphd{position:absolute;left:74px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));color:#3e2414;text-align:left;text-shadow:0 1px 0 #fff8e6}.maphd b{font-size:22px;letter-spacing:.06em}.maphd small{display:block;font-size:12px;opacity:.85}
.mapzoom{position:absolute;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}.mapzoom button{width:46px;height:46px;border-radius:50%;border:2px solid #8a5a30;background:#ffeccb;color:#3e2414;font-size:24px;font-weight:700}
/* death */
.death h1{color:#ffd0c0}.death p{max-width:440px;margin:6px auto}
/* in-game buttons */
#hbt{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:6;display:none;gap:10px}
#hbt button,#hb button,#use{border:2px solid rgba(232,192,112,.85);background:radial-gradient(circle at 40% 30%,rgba(110,72,40,.85),rgba(40,22,12,.85));color:#ffe9b8;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.45);padding:0}
#hbt button{width:calc(48px * var(--bs));height:calc(48px * var(--bs))}
#hb{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;display:none;gap:12px;align-items:flex-end}
#hb button{width:calc(70px * var(--bs));height:calc(70px * var(--bs))}#hb button.sm{width:calc(52px * var(--bs));height:calc(52px * var(--bs))}#hb button span,#use span{font-size:11px;margin-top:1px;letter-spacing:.04em}
#hb button.on{background:radial-gradient(circle at 40% 30%,#e8a040,#8a4a1a);color:#2a1408}
#use{position:fixed;right:calc(30px + env(safe-area-inset-right,0px));bottom:calc(110px * var(--bs) + 26px);z-index:6;width:calc(64px * var(--bs));height:calc(64px * var(--bs));display:none}
body.lh #hb{right:auto;left:calc(16px + env(safe-area-inset-left,0px));flex-direction:row-reverse}body.lh #use{right:auto;left:calc(30px + env(safe-area-inset-left,0px))}
#speech{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:7;width:min(92vw,560px);background:linear-gradient(rgba(40,22,12,.82),rgba(26,14,8,.92));border:1px solid rgba(243,185,85,.45);border-radius:16px;padding:10px 16px;opacity:0;transition:.35s;pointer-events:none;text-align:left}
#speech.on{opacity:1;transform:translate(-50%,0)}#speech b{display:block;color:var(--honey);font-size:14px;letter-spacing:.04em}#speech span{font-size:17px;line-height:1.45}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:35;background:rgba(30,16,8,.8);border:1px solid rgba(243,185,85,.4);border-radius:14px;padding:8px 16px;font-size:15px;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}#toast.on{opacity:1}
#tip{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;width:min(86vw,360px);background:linear-gradient(#ffeccb,#f4c987);color:#3e2414;border:2px solid #c98a45;border-radius:16px;padding:12px 14px;box-shadow:0 8px 20px rgba(0,0,0,.45);opacity:0;transform:translateY(20px);transition:.4s;pointer-events:none;text-align:left}
#tip.on{opacity:1;transform:none;pointer-events:auto}#tip b{display:block;font-size:16px;margin-bottom:2px}#tip span{font-size:14.5px;line-height:1.4}#tip button{margin-top:8px;border:1px solid #8a5a30;background:#fff8e6;border-radius:9px;padding:6px 12px;cursor:pointer}
body.lh #tip{left:auto;right:calc(14px + env(safe-area-inset-right,0px))}
.confirm{position:fixed;inset:0;z-index:40;background:rgba(10,5,2,.6);display:flex;align-items:center;justify-content:center}.confirm>div{width:min(90vw,380px);background:linear-gradient(#ffeccb,#f4c987);color:#3e2414;border:2px solid #c98a45;border-radius:18px;padding:18px;text-align:center;display:grid;gap:10px}.confirm p{margin:0;font-size:17px;line-height:1.45}.confirm .ghost{color:#3e2414;border-color:#8a5a30;background:rgba(255,255,255,.4)}
.wait{display:grid;gap:12px;justify-items:center}.bar{width:min(80vw,360px);height:10px;border-radius:6px;background:rgba(255,236,200,.15);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e08a3c,#ffd98a);transition:width .3s}
#fatal{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;flex-direction:column;background:#1e120a;color:#ffe9b8;padding:24px;text-align:center}
body.big #speech span,body.big .cintext,body.big .lorecard p{font-size:20px}
@media (max-width:640px){.ccp{max-height:38vh}.cc{gap:8px}#ccv{width:min(220px,52vw)}.ccl{padding:6px}}

</style>

<body>
<canvas id="c"></canvas><canvas id="hud"></canvas>
<div id="ui"></div><div id="cin"></div><button id="bk" aria-label="Back"></button>
<div id="hbt"></div><div id="hb"></div><button id="use" aria-label="Use"></button>
<div id="speech"></div><div id="toast"></div><div id="tip"></div>
<div id="fatal"><h2>Sunderlight could not start</h2><p></p><small>Try refreshing the page. If this keeps happening, please report what the message says.</small></div>
<div id="loading" style="position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#1e120a;color:#f6e2b8;font:20px Georgia,serif;letter-spacing:.1em">Loading Ondravael…</div>
<noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1e120a;color:#f6e2b8;font:18px Georgia,serif;padding:24px;text-align:center">Sunderlight needs JavaScript to run. Please enable it and reload.</div></noscript>
<script id="game">
/*GAME-START*/
(function () {
// ============================================================================
const PlatformBridge = {
  platform: 'web', // Detected at runtime: 'web', 'steam', 'android'
  isInitialized: false,
  saveKey: 'sunderlight_v1',
  devMock: /[?&]dev=1/.test((typeof location !== 'undefined' && location.search) || ''),
  products: [
    { id: 'remove_ads', kind: 'non' },
    { id: 'coins_100', kind: 'con' },
    { id: 'supporter_pack', kind: 'non' }
  ],

  /** Auto-detect environment and initialize SDK connections. */
  init() { return this._p || (this._p = this._init()); },
  async _init() {
    if (this.isInitialized) return;
    console.log('[PlatformBridge] Detecting host environment...');
    // 1. Detect Steam Environment (NW.js / Electron node integration)
    if (typeof process !== 'undefined' && process.versions && (process.versions.nw || process.versions.electron)) {
      this.platform = 'steam';
      await this.initSteam();
    }
    // 2. Detect Android Environment (Capacitor Native bridge)
    else if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
      this.platform = 'android';
      await this.initAndroid();
    }
    // 3. Browser Sandbox Fallback
    else {
      this.platform = 'web';
      console.log('[PlatformBridge] Environment: Standard Web Browser (Dev Sandbox)');
    }
    if (this.platform !== 'web') this.lockdown();
    this.isInitialized = true;
    window.dispatchEvent(new CustomEvent('platformBridgeReady', { detail: { platform: this.platform } }));
  },

  /** Packaged builds only: no context menu, no DevTools shortcuts. (Browser builds stay debuggable.) */
  lockdown() {
    window.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('keydown', e => {
      const k = (e.key || '').toLowerCase();
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')) || (e.ctrlKey && k === 'u')) e.preventDefault();
    });
  },

  // --------------------------------------------------------------------------
  // STEAM INITIALIZATION & APIS
  // --------------------------------------------------------------------------
  async initSteam() {
    console.log('[PlatformBridge] Initializing Steam SDK...');
    try {
      // Check for Greenworks (NW.js) or steamworks.js (Electron)
      if (typeof require !== 'undefined') {
        this.greenworks = require('./greenworks');
        if (this.greenworks && this.greenworks.init()) {
          console.log('[PlatformBridge] Steamworks API initialized successfully.');
          const steamId = this.greenworks.getSteamId();
          console.log(`[PlatformBridge] Logged in as Steam User: ${steamId.screenName}`);
        } else {
          console.warn('[PlatformBridge] Steamworks init failed. Ensure Steam client is running and steam_appid.txt exists.');
        }
      }
    } catch (err) {
      console.error('[PlatformBridge] Error loading Steam native bindings:', err);
    }
  },

  // --------------------------------------------------------------------------
  // ANDROID INITIALIZATION & GOOGLE PLAY BILLING
  // --------------------------------------------------------------------------
  async initAndroid() {
    console.log('[PlatformBridge] Initializing Google Play Billing...');
    try {
      const CP = window.CdvPurchase;
      if (CP && CP.store) {
        // cordova-plugin-purchase v13+ (CdvPurchase namespace)
        const { store, ProductType, Platform } = CP;
        this._v13 = true;
        store.register(this.products.map(p => ({ id: p.id, type: p.kind === 'con' ? ProductType.CONSUMABLE : ProductType.NON_CONSUMABLE, platform: Platform.GOOGLE_PLAY })));
        // Fulfil once Google Play approves the transaction, then finish (acknowledge/consume) it.
        store.when().approved(tx => { (tx.products || []).forEach(pr => this.onPurchaseSuccess(pr.id)); tx.finish(); });
        await store.initialize([Platform.GOOGLE_PLAY]);
        console.log('[PlatformBridge] Google Play Billing (v13 API) registered.');
      } else if (window.store) {
        // cordova-plugin-purchase v11 and earlier (global store), as in the Master Architecture Blueprint
        const store = window.store;
        store.register(this.products.map(p => ({ id: p.id, type: p.kind === 'con' ? store.CONSUMABLE : store.NON_CONSUMABLE })));
        try {
          store.when('product').approved(p => { this.onPurchaseSuccess(p.id); if (p.finish) p.finish(); });
        } catch (e) { console.warn('[PlatformBridge] Could not attach approval handler:', e); }
        store.refresh();
        console.log('[PlatformBridge] Google Play Billing (v11 API) registered.');
      }
    } catch (err) {
      console.error('[PlatformBridge] Error initializing Play Billing:', err);
    }
  },

  // --------------------------------------------------------------------------
  // MONETIZATION & IN-APP PURCHASES
  // --------------------------------------------------------------------------
  purchaseItem(productId) {
    console.log(`[PlatformBridge] Initiating purchase for: ${productId}`);
    if (this.platform === 'steam') {
      // Steam handles primary payments upfront via app purchase.
      // For Microtransactions: Trigger Steam Microtransaction Web API via backend or Greenworks
      console.log(`[Steam] Triggering Steam overlay/microtransaction for SKU: ${productId}`);
      window.dispatchEvent(new CustomEvent('purchaseUnavailable', { detail: { productId, platform: 'steam' } }));
    }
    else if (this.platform === 'android') {
      const CP = window.CdvPurchase;
      if (this._v13 && CP && CP.store) {
        const offer = (CP.store.get(productId, CP.Platform.GOOGLE_PLAY) || {}).getOffer ? CP.store.get(productId, CP.Platform.GOOGLE_PLAY).getOffer() : null;
        if (offer) {
          Promise.resolve(offer.order())
            .then(err => { if (err) console.error('[Play Store] Purchase failed:', err); else console.log(`[Play Store] Purchase initiated: ${productId}`); })
            .catch(err => console.error('[Play Store] Purchase failed:', err));
        } else {

    atm: { minutes: ATM.minutes, day: ATM.day, state: ATM.state }, found: JSON.parse(JSON.stringify(G.found)), seen: Object.assign({}, LIFE.seen), tips: Object.assign({}, G.tips), stats: Object.assign({}, G.stats),
