<script id="game">
window.addEventListener('load',function(){try{
/*GAME-START*/
// ============================================================================
// NATIVE PLATFORM BRIDGE (Steamworks, Google Play Billing & Web Fallback)
// From the Master Architecture Blueprint, Phase 1. All saves, achievements and
// purchases in this game go through this object so the same single index.html
// runs in a browser, in NW.js (Steam) and in Capacitor (Google Play).
// Adaptations: namespaced save key (several games can share one web origin),
// auto-init that also works after DOMContentLoaded, Android purchase approval
// hook, web-build purchase gating, and desktop/mobile lockdown for packaged builds.
// ============================================================================
const PlatformBridge = {
  platform: 'web', // Detected at runtime: 'web', 'steam', 'android'
  isInitialized: false,
  saveKey: 'sunderlight_save_v4',
  devMock: /[?&]dev=1/.test((typeof location !== 'undefined' && location.search) || ''),
  products: [
    { id: 'remove_ads', kind: 'non' },
    { id: 'coins_100', kind: 'con' },
    { id: 'supporter_pack', kind: 'non' }
  ],

  /** Auto-detect environment and initialize SDK connections. */
  init() { return this._p || (this._p = this._init()); },
  async _init() {
    if (this.isInitialized) return;
    console.log('[PlatformBridge] Detecting host environment...');
    // 1. Detect Steam Environment (NW.js / Electron node integration)
    if (typeof process !== 'undefined' && process.versions && (process.versions.nw || process.versions.electron)) {
      this.platform = 'steam';
      await this.initSteam();
    }
    // 2. Detect Android Environment (Capacitor Native bridge)
    else if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
      this.platform = 'android';
      await this.initAndroid();
    }
    // 3. Browser Sandbox Fallback
    else {
      this.platform = 'web';
      console.log('[PlatformBridge] Environment: Standard Web Browser (Dev Sandbox)');
    }
    if (this.platform !== 'web') this.lockdown();
    this.isInitialized = true;
    window.dispatchEvent(new CustomEvent('platformBridgeReady', { detail: { platform: this.platform } }));
  },

  /** Packaged builds only: no context menu, no DevTools shortcuts. (Browser builds stay debuggable.) */
  lockdown() {
    window.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('keydown', e => {
      const k = (e.key || '').toLowerCase();
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')) || (e.ctrlKey && k === 'u')) e.preventDefault();
    });
  },

  // --------------------------------------------------------------------------
  // STEAM INITIALIZATION & APIS
  // --------------------------------------------------------------------------
  async initSteam() {
    console.log('[PlatformBridge] Initializing Steam SDK...');
    try {
      // Check for Greenworks (NW.js) or steamworks.js (Electron)
      if (typeof require !== 'undefined') {
        this.greenworks = require('./greenworks');
        if (this.greenworks && this.greenworks.init()) {
          console.log('[PlatformBridge] Steamworks API initialized successfully.');
          const steamId = this.greenworks.getSteamId();
          console.log(`[PlatformBridge] Logged in as Steam User: ${steamId.screenName}`);
        } else {
          console.warn('[PlatformBridge] Steamworks init failed. Ensure Steam client is running and steam_appid.txt exists.');
        }
      }
    } catch (err) {
      console.error('[PlatformBridge] Error loading Steam native bindings:', err);
    }
  },

  // --------------------------------------------------------------------------
  // ANDROID INITIALIZATION & GOOGLE PLAY BILLING
  // --------------------------------------------------------------------------
  async initAndroid() {
    console.log('[PlatformBridge] Initializing Google Play Billing...');
    try {
      const CP = window.CdvPurchase;
      if (CP && CP.store) {
        // cordova-plugin-purchase v13+ (CdvPurchase namespace)
        const { store, ProductType, Platform } = CP;
        this._v13 = true;
        store.register(this.products.map(p => ({ id: p.id, type: p.kind === 'con' ? ProductType.CONSUMABLE : ProductType.NON_CONSUMABLE, platform: Platform.GOOGLE_PLAY })));
        // Fulfil once Google Play approves the transaction, then finish (acknowledge/consume) it.
        store.when().approved(tx => { (tx.products || []).forEach(pr => this.onPurchaseSuccess(pr.id)); tx.finish(); });
        await store.initialize([Platform.GOOGLE_PLAY]);
        console.log('[PlatformBridge] Google Play Billing (v13 API) registered.');
      } else if (window.store) {
        // cordova-plugin-purchase v11 and earlier (global store), as in the Master Architecture Blueprint
        const store = window.store;
        store.register(this.products.map(p => ({ id: p.id, type: p.kind === 'con' ? store.CONSUMABLE : store.NON_CONSUMABLE })));
        try {
          store.when('product').approved(p => { this.onPurchaseSuccess(p.id); if (p.finish) p.finish(); });
        } catch (e) { console.warn('[PlatformBridge] Could not attach approval handler:', e); }
        store.refresh();
        console.log('[PlatformBridge] Google Play Billing (v11 API) registered.');
      }
    } catch (err) {
      console.error('[PlatformBridge] Error initializing Play Billing:', err);
    }
  },

  // --------------------------------------------------------------------------
  // MONETIZATION & IN-APP PURCHASES
  // --------------------------------------------------------------------------
  purchaseItem(productId) {
    console.log(`[PlatformBridge] Initiating purchase for: ${productId}`);
    if (this.platform === 'steam') {
      // Steam handles primary payments upfront via app purchase.
      // For Microtransactions: Trigger Steam Microtransaction Web API via backend or Greenworks
      console.log(`[Steam] Triggering Steam overlay/microtransaction for SKU: ${productId}`);
      window.dispatchEvent(new CustomEvent('purchaseUnavailable', { detail: { productId, platform: 'steam' } }));
    }
    else if (this.platform === 'android') {
      const CP = window.CdvPurchase;
      if (this._v13 && CP && CP.store) {
        const offer = (CP.store.get(productId, CP.Platform.GOOGLE_PLAY) || {}).getOffer ? CP.store.get(productId, CP.Platform.GOOGLE_PLAY).getOffer() : null;
        if (offer) {
          Promise.resolve(offer.order())
            .then(err => { if (err) console.error('[Play Store] Purchase failed:', err); else console.log(`[Play Store] Purchase initiated: ${productId}`); })
            .catch(err => console.error('[Play Store] Purchase failed:', err));
        } else {
          console.warn('[Play Store] Product not available yet:', productId);
          window.dispatchEvent(new CustomEvent('purchaseUnavailable', { detail: { productId, platform: 'android' } }));
        }
      } else if (window.store) {
        window.store.order(productId)
          .then(() => console.log(`[Play Store] Purchase initiated: ${productId}`))
          .catch(err => console.error('[Play Store] Purchase failed:', err));
      } else {
        console.warn('[Play Store] Store plugin not loaded.');
        window.dispatchEvent(new CustomEvent('purchaseUnavailable', { detail: { productId, platform: 'android' } }));
      }
    }
    else if (this.devMock) {
      // Web Dev Mode Mock (enabled with ?dev=1 in the page address)
      console.log(`[Dev Sandbox] Mock Purchase Success: ${productId}`);
      this.onPurchaseSuccess(productId);
    }
    else {
      // Public web build: real purchases happen in the Steam and Android versions.
      window.dispatchEvent(new CustomEvent('purchaseUnavailable', { detail: { productId, platform: 'web' } }));
    }

{n:'The Ridgeway',st:[

{n:'Salt and Sorrow',st:[

const PRO=[
'You are Edric Ashgrove, nineteen winters old, son of Tomas the beacon-keeper of Harrow Tor. Your mother Elsbeth died of winter fever when you were seven, and your father kept the Tor and raised you and your little sister Mira in the stone cottage beneath it.',
'Tomas taught you one thing above all: a beacon is a promise. It says to every traveler on the dark ridge, someone is coming to help. You have never held a sword. You can split kindling, read the ridge-signals, and carry water up a hill in the rain.',
'Three hundred years ago the Sunderlight, the fire that held back the dark, broke into seven shards when the Warden-King Aldemar fell to his own brother. Since then, the Ashgrove blood has carried a small ember, which your father called a quiet thing and never explained.',
'Tonight the ash is falling, the ridge-fires are going out, and something is coming up the valley road. Your father has been very still all evening. He has asked you to stay close.'];
const CINSUB=[[0,5,'','In the age of Beacons, a single fire kept the dark from Eldmark.'],[5.5,10.5,'','Three hundred years ago the Sunderlight shattered, and a hollow king rose to finish what the Sundering began.'],[11,16,'','Tonight the ridge-fires are dying, one by one.'],[16.5,21.5,'','Only Harrow Tor still waits to be lit.'],[22,28,'','The Hollow Host has come for the last keepers of the flame.'],[30,34,'Tomas','Edric. They are at the treeline. Listen to me.'],[34.5,39,'Tomas','The Tor must be lit, or the ridge never learns we fell.'],[39.5,44,'Tomas','But your sister is in the hall, and the Host will reach it before you reach the hill.'],[44.5,50,'Tomas','I will hold the gate. Do not ask me which. I do not know, son. No one ever does.'],[50.5,56,'','Fire... or family.']];
const LN={mo:['The vale remembers every child who ever ran its hills, Edric.','I have buried too many neighbors. I would rather hear you laugh.','Your mother sat on this very bench. She would be so proud of you.'],br:['Wardens stand watch so others can sleep. Remember that.','Your father taught me patience. I am still a poor student.','When you are ready, the Wardens would follow you.'],ze:['The sea has taught me to read weather and men. You read like a good book.','Every sailor needs a lighthouse. Your father was mine.','Fair winds, Edric. Always.'],qu:['A good story needs a brave reader. Keep turning pages.','I have written you into volume three. Do not disappoint me.','You taught an old monk to hope again.'],ta:['Everything has a price, but friendship gets a discount.','You remind me of someone who never gave up on the dark.','Keep my lantern. It brought me luck.']};

const LORE=[['Eldmark','A hilly realm of vales, forests, mountains and coast, held together for centuries by a chain of beacon-towers called the Ridgeway.'],['The Sunderlight','A star-fire gifted to the first Warden-Kings, said to be the warmth of every kept promise. It burned in the great beacon of the Hollow Keep.'],['The Sundering','When Aldemar fell to his brother Malrec, the Sunderlight broke into seven shards. Beacons across Eldmark have been dimming ever since.'],['The Hollow King','Malrec, once the Warden-King’s brother, hollowed himself around the largest shard. He cannot bear a lit lamp, and he wishes to quench every fire.'],['The Hollow Host','Ash-shades, briar wretches and gravewardens: the silent dead and half-dead who march in Malrec’s name. They fear warmth, not steel.'],['The Wardens','An old order of ridge-riders sworn to protect beacon-keepers. Few remain. Their post at the Wardens’ Ford still stands.'],['Ember-craft','Magic here is rare, quiet and costly. It is the Sunderlight’s warmth carried in the blood of a few families. Casting spends ember, which only rests and kept fires restore.'],['Harrowmere','A hill-village beneath Harrow Tor, home to farmers, millers and the Ashgrove beacon-keepers.'],['Saltreach','A harbor town on the southern coast. Ferrymen, net-menders and sailors keep its lanterns alive.'],['Quillmoor Abbey','A cliff-side monastery in the Stonecrown, keeper of every written ember-song and shard-lore.'],['Fenwick Market','A canyon market at Sunscar Mesa where everything is for sale except promises.'],['The Hamlets','Twenty-five hamlets hold the realm together, each with villagers who need help. Listen to them, and Eldmark remembers itself.']];
const MLT=[[66,140,'Edric, if you find this, I am proud of you already. I wrote it the night you were born, and I have been writing ever since.'],[84,132,'The first beacon I ever lit, I lit with your mother’s hand over mine. She said the light was a kind of prayer.'],[100,150,'When you were three, you climbed the Tor alone to see the fire. I found you asleep beside it. I have never been so afraid, or so happy.'],[130,150,'Mira was born in a snowstorm. She screamed so loudly the ridge-fires flared. I took it as a good omen.'],[150,120,'I am no warrior, son. I am a keeper. The brave thing is not to fight the dark, but to be there when it falls.'],[168,138,'Hale taught me that fear and care are the same coin. I think he is right.'],[176,84,'I do not know why the ember in our blood came to us. I only know it asks to be shared.'],[158,50,'If the ridge ever goes silent, do not wait for orders. Light what you can, wherever you stand.'],[120,64,'You laugh like your mother. I try not to say so too often. It hurts and warms me in equal measure.'],[56,64,'There is no shame in being afraid. There is only shame in letting fear make you small.'],[44,100,'I am not gone, Edric. I am in the warmth of every kept fire, and in every hand that reaches for a stranger.'],[113,34,'You found them all. The fire was never only in the Tor. It was always in you. Go and light the sky.']];

const ITEMS=['moonpetals','iron nails','hearth-stones','wild thyme','lambs’ bells','amber beads','river pearls','silver thread','oak galls','candle wicks','salt crystals','ember-moss','crow feathers','bee-balm','bog iron','fire agates','winter berries','old coins','clay shards','bone needles'];
const BOUNTY=['Old Greywhisker, the great boar','Skarn the Pale','The Briar Mother','Mournfang','Rotgut Hob','The Hollow Piper','Ashmaw','Cragtooth','The Lantern Thief','Black Nettle','Widowmaker','Grimsby the Cruel','The Fen Lurker','Ironbeak','Duskclaw','The Drowned Bell','Sallow Jack','Hexmoth','Gorgrim','The Weeping Knight'];
const NQT=['kill','collect','go','deliver','champion'],NQ=[];
NPCS.forEach((l,i)=>{const [pro,pre]=l.split('|'),h=HAM[(i>>3)%HAM.length],R=REG[BI[h.y*N+h.x]],d=R.d,ni=(i*37)%100,name=FIRST[ni]+' '+SUR[(i*13+7+((i/100)|0)*29)%100],s=i&7,ang=s*.785+hs(i,3,5)*.5,rad=58+(s%4)*24;let x=h.x*TS+16+Math.cos(ang)*rad,y=h.y*TS+26+Math.sin(ang)*rad;for(let k=0;k<8&&solid(x,y);k++){x+=Math.cos(ang)*14;y+=Math.sin(ang)*14}
 const type=NQT[i%5],tg=d==0?['gl']:d==1?['gl','th']:d==2?['th','kn']:['kn'];NQ.push({i,name,pro,pre,h:h.n,hid:h.id,hx:h.x,hy:h.y,d,x,y,type,tag:tg[i%tg.length],n:type=='collect'?3+(i%3):3+(i%4)+d,item:ITEMS[i%20],bounty:BOUNTY[i%20],look:look(i),xp:35+d*12+(i%5)*5,gl:25+(i%7)*9,to:null})});
NQ.forEach(q=>{if(q.type=='go')q.to=HAM[(HAM.findIndex(h=>h.id==q.hid)+7)%HAM.length];if(q.type=='deliver'){let j=(q.i+37)%200;while((j>>3)==(q.i>>3))j=(j+8)%200;q.to=j}});
const nqs=()=>save.nq,nqNeed=q=>q.type=='kill'||q.type=='collect'?q.n:1;
const nqCount=()=>Object.values(save.nq).filter(s=>s.s==3).length;
function nqAsk(q){const t=q.type;return t=='kill'?'Could you thin out the '+EN[q.tag].n+'s near '+q.h+'? Say '+q.n+' of them.':t=='collect'?'I need '+q.n+' '+q.item+' from the wilds around '+q.h+'. Will you gather them?':t=='go'?'Please carry word to '+q.to.n+': tell them '+q.name+' is well, and learn what they know. Then come back to me.':t=='deliver'?'This letter must reach '+NQ[q.to].name+' ('+NQ[q.to].pro+') in '+NQ[q.to].h+'. Will you take it?':'A beast called '+q.bounty+' lurks near '+q.h+'. Will you end it?'}
function nqProg(q){const s=save.nq[q.i];if(!s)return '';return q.type=='kill'?'Defeated '+Math.min(s.n,q.n)+' of '+q.n:q.type=='collect'?'Gathered '+Math.min(s.n,q.n)+' of '+q.n+' '+q.item:q.type=='go'?(s.n?'Word delivered. Return to '+q.name:'Travel to '+q.to.n):q.type=='deliver'?(s.n?'Letter delivered. Return to '+q.name:'Find '+NQ[q.to].name+' in '+NQ[q.to].h):(s.n?'The beast is slain. Return to '+q.name:'Hunt '+q.bounty)}
const nqDone=i=>{const q=NQ[i],s=save.nq[i];return !!s&&s.s==2&&s.n>=nqNeed(q)};
const THANKS=['My trade will recover thanks to you.','Eldmark needs more like you.','I owe you more than coin, but coin will have to do.','The ridge has not forgotten its friends.','Light and warmth to you, always.','You have lifted a weight I could not carry alone.'];
function offer(i){const q=NQ[i],c=[portK(i),q.name+', '+q.pro];show("<div class='talk'>"+portH(c[0],'big')+"<h2>"+c[1]+"</h2><p class='say'>"+q.pre+". "+nqAsk(q)+"</p><div class='col'>"+mbtn("data-nqa='"+i+"'",'I will help','Reward: '+q.xp+' experience and '+q.gl+' glow')+mbtn("data-nqd='"+i+"'",'Not right now')+"</div></div>",resume)}
function nqAccept(i){const q=NQ[i];save.nq[i]={s:2,n:0};msg('Quest accepted: '+q.name);sfx('accept');resume()}
function nqDecline(i){if(!save.nq[i])save.nq[i]={s:1,n:0};msg('You will remember '+NQ[i].name+'’s trouble.');resume()}
function nqComplete(i){const q=NQ[i],s=save.nq[i];talk([[i,'Thank you, '+CAST.wr[1]+'. '+THANKS[i%6]]],()=>{s.s=3;gainXp(q.xp);save.gl+=q.gl;if(i%4==0)save.inv.push(mk(SL[i%4],1+(i%3==0?1:0)));msg('Quest complete: '+q.name);sfx('complete');chk()},'Farewell')}
function nqTalk(i){const q=NQ[i],s=save.nq[i];
 for(const o of NQ){const os=save.nq[o.i];if(os&&os.s==2&&o.type=='deliver'&&o.to==i&&!os.n){os.n=1;talk([[i,'A letter from '+o.name+'? Thank you for bringing it. Please tell them I am grateful.']],()=>msg('Return to '+o.name+' in '+o.h),'Continue');return}}
 if(s&&s.s==3){talk([[i,'Good to see you again, '+CAST.wr[1]+'. Stay safe out there.']],null,'Farewell');return}
 if(s&&s.s==2){if(nqDone(i))nqComplete(i);else talk([[i,'Still at it? '+nqProg(q)+'.']],null,'I will return');return}offer(i)}
function nqKill(tag){for(const q of NQ){const s=save.nq[q.i];if(s&&s.s==2&&q.type=='kill'&&q.tag==tag&&s.n<q.n){s.n++;if(s.n>=q.n)msg('Return to '+q.name+' in '+q.h)}}}
function nqChamp(i){const s=save.nq[i];if(s&&s.s==2){s.n=1;msg('The beast is slain. Return to '+NQ[i].name)}}
function nqUpd(dt){for(const q of QI){if(q.got||hyp(q.x-P.x,q.y-P.y)>30)continue;const s=save.nq[q.i];if(!s||s.s!=2)continue;q.got=1;s.n++;burst(q.x,q.y,'#ffe9a8',8);sfx('pickup');pop(q.x,q.y-20,NQ[q.i].item,'#ffe9a8');if(s.n>=NQ[q.i].n)msg('Return to '+NQ[q.i].name)}}
function nqTick(){const s0=stepNow();if(s0&&s0.t=='cut'&&mode=='play'){cutRun(s0);return}
 for(const h of HAM){if(!save.hh[h.id]&&hyp(h.x*TS-P.x,h.y*TS-P.y)<TS*10){save.hh[h.id]=1;for(let k=0;k<8;k++){const idx=h.h*8+k;if(idx<200&&!save.nq[idx])save.nq[idx]={s:1,n:0}}msg('Rumors reach you in '+h.n)}}
 for(const q of NQ){const s=save.nq[q.i];if(!s||s.s!=2)continue;
  if(q.type=='go'&&!s.n&&hyp(q.to.x*TS-P.x,q.to.y*TS-P.y)<TS*4){s.n=1;msg('Word delivered. Return to '+q.name)}
  if(q.type=='collect'){const have=QI.filter(z=>z.i==q.i).length;for(let k=have;k<q.n;k++){let a=hs(q.i,k,91)*6.28,r=170+hs(q.i,k,92)*260,x=q.hx*TS+16+Math.cos(a)*r,y=q.hy*TS+16+Math.sin(a)*r;for(let t=0;t<30&&solid(x,y);t++){a+=.5;r=Math.max(110,r-10);x=q.hx*TS+16+Math.cos(a)*r;y=q.hy*TS+16+Math.sin(a)*r}QI.push({i:q.i,x,y,got:k<s.n?1:0})}}
  if(q.type=='champion'&&!s.n&&!ens.some(e=>e.champ===q.i)&&hyp(q.hx*TS-P.x,q.hy*TS-P.y)<1500){const a0=hs(q.i,7,93)*6.28;let sx=0,sy=0,okp=0;for(let k=0;k<36&&!okp;k++){const a=a0+k*.7,r=380-(k%4)*80;sx=q.hx*TS+16+Math.cos(a)*r;sy=q.hy*TS+16+Math.sin(a)*r;if(!solid(sx,sy)&&!solid(sx+14,sy)&&!solid(sx-14,sy)&&!solid(sx,sy+14)&&!solid(sx,sy-14))okp=1}if(okp){const e=mkE(['gl','th','kn','kn'][q.d]||'kn',sx,sy,q.d+1);e.hp*=2.2;e.mh=e.hp;e.champ=q.i;e.name=q.bounty;e.key='champ';ens.push(e)}}}}
function stepSpawn(dt){ssT-=dt;if(ssT>0)return;ssT=1;const s=stepNow();if(!s||s.t!='kill'||!s.at||(EN[s.tag]&&EN[s.tag].b))return;const need=s.n-save.q.n,tag=s.spawn||s.tag,p=poiOf(s.at);if(hyp(p.x*TS-P.x,p.y*TS-P.y)>1300)return;const have=ens.filter(e=>e.k==tag).length;for(let i=have;i<Math.min(need,4);i++){const a=Math.random()*6.28,r=260+Math.random()*120,e=mkE(tag,p.x*TS+Math.cos(a)*r,p.y*TS+Math.sin(a)*r,0);if(!solid(e.x,e.y)){e.key='qs';ens.push(e)}}}
/* ---- interaction ---- */
function near(){for(const p of POI){const X=p.x*TS+TS/2,Y=p.y*TS+TS/2;if(p.npc&&hyp(P.x-(X+46),P.y-(Y+10))<60)return{t:'npc',p};if(p.k=='shrine'&&hyp(P.x-X,P.y-Y)<64)return{t:'shr',p};if(p.k=='ruin'&&!save.ch[p.id]&&hyp(P.x-X,P.y-(Y+24))<56)return{t:'chest',p}}
 const s=stepNow();if(s&&s.t=='item'&&SW&&hyp(P.x-SW.x,P.y-SW.y)<70)return{t:'sword'};for(const n of NQ)if(Math.abs(P.x-n.x)<54&&Math.abs(P.y-n.y)<54&&hyp(P.x-n.x,P.y-n.y)<54)return{t:'nq',n};return null}
function takeSword(){const it={s:'staff',lk:0,ti:1,nm:'Fallen Warden’s Sword',st:{atk:5}};save.E.staff=it;syncEq();SW=null;save.sw=null;sfx('sword');msg('You take the Warden’s sword. It is heavier than it looks.');adv(stepNow())}
function interact(){const n=near();if(!n)return;const p=n.p;
 if(n.t=='sword'){takeSword();return}if(n.t=='nq'){nqTalk(n.n.i);return}
 if(n.t=='shr'){save.rest=p.id;P.hp=ST.hp;P.mp=ST.mp;P.st=100;save.poi[p.id]=1;pop(P.x,P.y-34,'Rested','#ffe9a8');sfx('heal');store();return}
 if(n.t=='chest'){save.ch[p.id]=1;const it=mk(SL[Math.random()*4|0],2+(Math.random()<.4?1:0));save.inv.push(it);const g2=40+(Math.random()*50|0);save.gl+=g2;msg('Chest: '+it.nm+' and '+g2+' glow');sfx('coin');return}
 npcTalk(p)}
function npcTalk(p){const s=stepNow();if(s&&s.t=='talk'&&s.p==p.id){const L=typeof s.say=='function'?s.say():s.say;talk(L,()=>{s.fn&&s.fn();adv(s)},'Continue');return}
 const n=p.npc,b=save.bd[n]||0;if(save.vd[n]===day()){talk([[n,'Good to see you again, '+CAST.wr[1]+'. Stay safe out there.']],()=>{if(n=='ta')shop()},'Farewell');return}
 save.vd[n]=day();const nb=Math.min(5,b+1);save.bd[n]=nb;const L=[[n,LN[n][Math.min(2,b>>1)]+'  ('+'●'.repeat(nb)+'○'.repeat(5-nb)+')']];if(nb==5&&b<5&&MEM[n])L.push([n,MEM[n]]);talk(L,()=>{if(n=='ta')shop()},'Thank you')}
function cutRun(s){if(mode!='play')return;talk(s.say,()=>{s.fn&&s.fn();adv(s)},'Continue')}
/* ---- trophies ---- */
const ACH=[['First Blood','Defeat an enemy',()=>save.kills>=1,'ACH_FIRST_BLOOD'],['Sword in Hand','Take the Warden’s sword',()=>!!save.E.staff||save.q.a>0,'ACH_SWORD_IN_HAND'],['Ember-born','Learn your first skill',()=>Object.keys(save.skn).length>=1,'ACH_EMBER_BORN'],['Veteran','Reach level 10',()=>save.lv>=10,'ACH_VETERAN'],['Neighbor','Complete 10 villager quests',()=>nqCount()>=10,'ACH_NEIGHBOR'],['Beloved of Eldmark','Complete 50 villager quests',()=>nqCount()>=50,'ACH_BELOVED'],['Father’s Voice','Find all 12 of Tomas’s notes',()=>Object.keys(save.ml).length>=12,'ACH_FATHERS_VOICE'],['Wanderer','Discover every hamlet',()=>HAM.every(h=>save.poi[h.id]),'ACH_WANDERER'],['Hale’s Oath','Lose Warden Hale and carry on',()=>save.q.a>=4,'ACH_HALES_OATH'],['The Last Beacon','Complete the main quest',()=>save.q.a>=QS.length,'ACH_LAST_BEACON']];
function chk(){for(let i=0;i<ACH.length;i++){if(!save.ac.includes(i)&&ACH[i][2]()){save.ac.push(i);save.gl+=40;PlatformBridge.unlockAchievement(ACH[i][3]);msg('Trophy: '+ACH[i][0]);sfx('complete')}}store()}
/* ================= THE OPENING: a short film in the game engine ================= */
function cinCam(){const t=CIN.t,K=CIN.k;let i=0;while(i<K.length-2&&t>K[i+1][0])i++;const a=K[i],b=K[i+1],u=cl((t-a[0])/(b[0]-a[0]),0,1),e=u*u*(3-2*u),L=j=>a[j]+(b[j]-a[j])*e;return{x:L(1),y:L(2),ho:L(3),yaw:a[4]+angd(b[4],a[4])*e,pitch:L(5)}}
function cinOverlay(w,h){const bh=h*.11;g.fillStyle='#000';g.fillRect(0,0,w,bh);g.fillRect(0,h-bh,w,bh);const t=CIN.t,s=CINSUB.find(x=>t>=x[0]&&t<x[1]);if(s){const L=wrap((s[2]?s[2]+': ':'')+s[3],w-40,15);L.forEach((l,i)=>txt(l,w/2,h-bh+24+i*18-(L.length-1)*8,15,'center',s[2]?'#ffe9a8':'#fff1d6'))}const f=Math.min(1,t/1.2,(56-t)/1.2);if(f<1){g.fillStyle='rgba(0,0,0,'+(1-Math.max(0,f))+')';g.fillRect(0,0,w,h)}}
function startCin(){const v=poiOf('vil'),tr=poiOf('tor'),vx=v.x*TS+16,vy=v.y*TS+16,tx=tr.x*TS+16,ty=tr.y*TS+16,ya=(x,y,X,Y)=>Math.atan2(Y-y,X-x);
 CIN={t:0,k:[[0,vx+900,vy+620,260,ya(vx+900,vy+620,vx,vy),.1],[10,vx+300,vy+220,120,ya(vx+300,vy+220,vx,vy-60),.03],[20,vx+60,vy-300,150,ya(vx+60,vy-300,tx,ty),.04],[30,vx-330,vy+10,38,Math.PI,.03],[36,vx+10,vy+175,30,-Math.PI/2,.02],[50,vx+10,vy+135,30,-Math.PI/2,.02],[56,vx+10,vy+133,30,-Math.PI/2+.9,.05]]};
 XS=[];for(let i=0;i<9;i++){const e={k:'gl',t:EN.gl,x:vx-820+(i%3)*50+hs(i,1,3)*40,y:vy-140+i*34,hp:1,mh:1,tl:0};XS.push({x:e.x,y:e.y,s:1.6,fn:()=>drawEnemy(e)})}
 XS.push({x:vx,y:vy+80,s:1.3,fn:()=>person(vx,vy+80,CAST.ne[0],KL.ne.cl,'')});XS.push({x:vx+26,y:vy+90,s:1.1,fn:()=>person(vx+26,vy+90,CAST.mi[0],KL.mi.cl,'')});
 mode='cin';ui.style.display='none';bk.style.display='none';skp.style.display='block'}
function cinStep(dt){if(!CIN)return;CIN.t+=dt;if(CIN.t>=56)endCin()}
function endCin(){skp.style.display='none';XS=[];CIN=null;choiceScreen()}
function applyFate(f){save.fate=f;save.pro=1;const v=poiOf('vil'),t=poiOf('tor');let sx,sy,yaw;if(f=='tor'){sx=t.x*TS+56;sy=t.y*TS+86;yaw=1.5708}else{sx=v.x*TS+16;sy=v.y*TS+106;yaw=-1.5708}
 P.x=sx;P.y=sy;P.yaw=yaw;P.pitch=0;P.hp=ST.hp;P.mp=ST.mp;P.st=100;SW={x:sx+Math.cos(yaw+.5)*125,y:sy+Math.sin(yaw+.5)*125};save.sw=SW;ens.length=0;act={};store();resume();msg(f=='tor'?'You choose the Tor. The ridge must be told.':'You choose Mira. The hall must hold.')}


/* ---- Supporter store: every purchase goes through PlatformBridge.purchaseItem() ---- */
function storeScreen(){const o=save.owned||{};show("<h1 class='sm'>Supporter Store</h1><p class='dim'>Eldmark is free to explore. These are optional ways to support the game. Purchases are available in the Steam and Android editions.</p><div class='col'>"+mbtn("data-buy2='coins_100'",'Pouch of Glow','100 glow, spent at Tamsin’s stall')+(o.supporter_pack?"<div class='card c' style='opacity:.6'><b>Supporter’s Pack</b><small>Owned. Thank you!</small></div>":mbtn("data-buy2='supporter_pack'",'Supporter’s Pack','Patron’s Mantle, 3 skill sparks and our thanks'))+"</div>",pauseMenu)}
function fulfil(id){save.owned=save.owned||{};if(id=='coins_100'){save.gl+=100;msg('100 glow added. Thank you!')}else if(id=='supporter_pack'&&!save.owned.supporter_pack){save.owned.supporter_pack=1;save.sp+=3;const it=mk('cloak',3,1);it.nm='Patron’s Mantle';it.st={hp:36,def:5,spd:.05};save.inv.push(it);msg('Supporter’s Pack unlocked. Thank you!')}else if(id=='remove_ads'){save.owned.remove_ads=1;msg('Thank you for supporting the game!')}store()}
window.addEventListener('itemPurchased',e=>fulfil(e.detail.productId));
window.addEventListener('purchaseUnavailable',e=>msg(e.detail.platform=='steam'?'This edition has no in-game purchases. Thank you for playing!':'Purchases are available in the Steam and Android editions.'));
/* ---- apply a loaded save (called through PlatformBridge.loadData) then show the title ---- */
function applySave(d){if(d&&typeof d=='object'){const set=Object.assign({},save.set,d.set||{});Object.assign(save,d);save.set=set}for(const k in D0)if(save[k]===undefined)save[k]=D0[k];
 CAST.wr[1]=save.name||'Edric';if(save.sw&&stepNow()&&stepNow().t=='item')SW=save.sw;syncEq();ST=stats();P.x=save.x;P.y=save.y;P.hp=ST.hp;P.mp=ST.mp;
 if(save.fog){const im=new Image();im.onload=()=>{fx.globalCompositeOperation='source-over';fx.clearRect(0,0,N,N);fx.drawImage(im,0,0)};im.src=save.fog}title()}

/* ================= BOOT ================= */
function fit(){DPR=Math.min(devicePixelRatio||1,3);cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px'}
addEventListener('resize',fit);fit();
function loop(ts){let dt=Math.min(.05,(ts-last)/1000||0);last=ts;perf(dt);DT=dt;T+=dt;SH=Math.max(0,SH-dt);try{if(mode=='play'){if(HS>0){HS-=dt;dt*=.25}upd(dt)}if(mode=='cin')cinStep(dt);draw()}catch(e){console.error(e)}requestAnimationFrame(loop)}
PlatformBridge.init().then(()=>PlatformBridge.loadData(applySave)).catch(()=>applySave(null));
requestAnimationFrame(loop);
/*GAME-END*/
try{window.dispatchEvent(new Event('resize'));setTimeout(function(){window.dispatchEvent(new Event('resize'))},150);setTimeout(function(){window.dispatchEvent(new Event('resize'))},600)}catch(e){}
requestAnimationFrame(function(){window.__booted=true;var l=document.getElementById('loading');if(l)l.remove()});
}catch(e){window.__fatal('Startup error',e,true)}});
</script>
