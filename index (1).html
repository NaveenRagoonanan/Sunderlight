function seen(cam,ax,ay,oh){for(let i=1;i<7;i++){const t=i/7,x=cam.x+(ax-cam.x)*t,y=cam.y+(ay-cam.y)*t,rh=cam.h+(oh-cam.h)*t;if(terrH(x,y)>rh+6)return false}return true}
const comp={x:0,y:0,cd:0,init:0};
function compUpd(dt){if(!save.comp)return;if(!comp.init){comp.x=P.x-40;comp.y=P.y+30;comp.init=1}
 let tx=P.x-Math.cos(P.yaw-.8)*46,ty=P.y-Math.sin(P.yaw-.8)*46,tg=null,td=260;
 for(const e of ens){const d=hyp(e.x-P.x,e.y-P.y);if(d<td){td=d;tg=e}}if(tg){tx=tg.x;ty=tg.y}
 const d=hyp(tx-comp.x,ty-comp.y);if(d>14){const k=Math.min(1,d/50)*150*dt/d;move(comp,(tx-comp.x)*k,(ty-comp.y)*k,8)}
 comp.cd-=dt;if(comp.cd<=0){for(const e of ens.slice()){if(hyp(e.x-comp.x,e.y-comp.y)<e.t.r+46){comp.cd=1.1;hurtE(e,ST.atk*.8,comp.x,comp.y);break}}}
 if(hyp(comp.x-P.x,comp.y-P.y)>500){comp.x=P.x-40;comp.y=P.y+30}}
function drawComp(){const im=IMG(icn(CAST.br[0]));g.fillStyle='#0003';g.beginPath();g.ellipse(comp.x,comp.y,14,5,0,0,7);g.fill();if(im.complete&&im.naturalWidth)g.drawImage(im,comp.x-22,comp.y-46,44,44)}
function world3(cam,w,h,tp){const sp=[],foc=w/2;
 const add=(ax,ay,z,s,fn,lo)=>{const dx=ax-cam.x,dy=ay-cam.y,zc=dx*cam.fx+dy*cam.fy;if(zc<10||zc>1500)return;const lat=dx*cam.rx+dy*cam.ry;if(Math.abs(lat)>zc*1.25+90)return;if(!lo&&!seen(cam,ax,ay,z+16))return;sp.push({zc,lat,ax,ay,z,s,fn})};
 const cxT=cam.x/TS|0,cyT=cam.y/TS|0,tx0=Math.max(0,cxT-24),tx1=Math.min(N-1,cxT+24),ty0=Math.max(0,cyT-24),ty1=Math.min(N-1,cyT+24);
 for(let y=ty0;y<=ty1;y++)for(let x=tx0;x<=tx1;x++){const i=y*N+x;if(TL[i]||!DC[i])continue;const dc=DC[i],k=BI[i],X=x*TS+16,Y=y*TS+28;if(dc==2&&hyp(X-cam.x,Y-cam.y)>420)continue;add(X,Y,terrH(X,Y),dc==1?2:1.4,()=>decor(x,y,k,dc))}
 for(const p of POI){const X=p.x*TS+16,Y=p.y*TS+16;
  if(p.k=='town'){for(const [a,b,c] of HOUSES)add(X+a+17,Y+b+24,terrH(X+a,Y+b),2,()=>house(X+a+17,Y+b+24,c),1)}
  else add(X,Y+(p.k=='spire'?30:20),terrH(X,Y),p.k=='spire'?1.5:1.7,()=>drawPoi(p),1);
  if(p.npc)add(X+46,Y+10,terrH(X+46,Y+10),1.3,()=>drawNpc(p),1)}
 for(const e of ens)add(e.x,e.y,terrH(e.x,e.y),1.5,()=>drawEnemy(e));
 for(const q of wisps)add(q.x,q.y,terrH(q.x,q.y)+10,1.5,()=>wisp(q.x,q.y-10+Math.sin(T*3+q.x)*4),1);
 ML.forEach((m,i)=>{if(!save.ml[i])add(m.x,m.y,terrH(m.x,m.y),1.8,()=>drawLantern(m,i),1)});
 for(const p of pr)add(p.x,p.y,terrH(p.x,p.y)+18,1.4,()=>{wisp(p.x,p.y);if(!p.o){g.fillStyle='#7a2fb0';g.beginPath();g.arc(p.x,p.y,6,0,7);g.fill()}},1);
 if(save.pet)add(pet.x,pet.y,terrH(pet.x,pet.y)+14,1.5,()=>drawPet(),1);
 if(save.comp)add(comp.x,comp.y,terrH(comp.x,comp.y),1.4,()=>drawComp(),1);
 if(tp)add(P.x,P.y,terrH(P.x,P.y),1.7,()=>{if(P.inv<=0||((T*20|0)%2))hero(P.x,P.y-14,.5,P.roll>0?T*18:Math.sin(P.mv)*.04)},1);
 sp.sort((a,b)=>b.zc-a.zc);
 for(const it of sp){const sx=w/2+it.lat/it.zc*foc,sy=cam.hzS+(cam.h-it.z)/it.zc*foc,k=foc/it.zc*it.s;g.globalAlpha=cl(1.25-it.zc/1350,0,1);g.save();g.translate(sx,sy);g.scale(k,k);g.translate(-it.ax,-it.ay);it.fn();g.restore()}
 g.globalAlpha=1;
 for(const p of parts){const q=pj(cam,p.x,p.y,terrH(p.x,p.y)+14+(.5-p.l)*10,w);if(q){g.globalAlpha=Math.max(0,p.l*2);g.fillStyle=p.c;g.beginPath();g.arc(q.sx,q.sy,Math.max(1.2,3*q.sc),0,7);g.fill()}}
 g.globalAlpha=1;
 for(const p of pops){const q=pj(cam,p.x,p.y,terrH(p.x,p.y)+36,w);if(q){g.globalAlpha=Math.min(1,p.l*2);txt(p.t,q.sx,q.sy-(.9-p.l)*40,14,'center',p.c)}}
 g.globalAlpha=1}
function fpHands(w,h){const sw=P.atk>0?Math.sin(cl(1-P.atk/.3,0,1)*3.14):0,bob=Math.sin(P.mv)*4;g.save();g.translate(w*.74-sw*w*.28,h*.97+bob-sw*h*.1);g.rotate(-.32-sw*1.1);g.strokeStyle='#8d6e63';g.lineWidth=Math.max(7,w*.022);g.lineCap='round';g.beginPath();g.moveTo(0,h*.1);g.lineTo(0,-h*.22);g.stroke();
 const gl=g.createRadialGradient(0,-h*.24,2,0,-h*.24,h*.09);gl.addColorStop(0,'rgba(255,251,224,1)');gl.addColorStop(.4,'rgba(255,226,122,.7)');gl.addColorStop(1,'rgba(255,226,122,0)');g.fillStyle=gl;g.beginPath();g.arc(0,-h*.24,h*.09,0,7);g.fill();g.fillStyle='#b69cff';g.beginPath();g.ellipse(0,h*.02,w*.045,h*.05,0,0,7);g.fill();g.restore()}

/* ---- the 3D frame (replaces the old top-down draw) ---- */
function draw(){const w=innerWidth,h=innerHeight;g.setTransform(DPR,0,0,DPR,0,0);
 if(mode=='map'){drawMapScreen(w,h);return}
 if(!started)P.yaw+=.0016;
 const tp=!!save.view,yaw=P.yaw,pit=P.pitch,gr0=terrH(P.x,P.y),fxv=Math.cos(yaw),fyv=Math.sin(yaw);
 let cx=P.x,cy=P.y,ch=gr0+26;
 if(tp){cx=cl(P.x-fxv*95,8,N*TS-8);cy=cl(P.y-fyv*95,8,N*TS-8);ch=Math.max(terrH(cx,cy)+22,gr0+58)}
 const cam={x:cx,y:cy,h:ch,fx:fxv,fy:fyv,rx:-fyv,ry:fxv},sc=skyCols(),hz=h*(.5+pit);cam.hzS=hz;
 ensureBuf(w,h);drawSky(w,h,hz,yaw,sc);
 terrain(cx,cy,ch,yaw,BH*(.5+pit),sc.lum,sc.hz[0],sc.hz[1],sc.hz[2]);octx.putImageData(img,0,0);g.imageSmoothingEnabled=true;g.drawImage(oc,0,0,w,h);
 world3(cam,w,h,tp);if(P.lock){const q=pj(cam,P.lock.x,P.lock.y,terrH(P.lock.x,P.lock.y)+26,w);if(q){g.strokeStyle='#ffd98a';g.lineWidth=3;g.beginPath();g.arc(q.sx,q.sy,Math.max(14,51*q.sc),0,7);g.stroke()}}
 if(!tp&&mode=='play'){fpHands(w,h);g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=2;g.beginPath();g.arc(w/2,hz,5,0,7);g.stroke()}
 if(P.atk>0){const a=1-P.atk/.3;g.strokeStyle='rgba(255,240,180,'+cl(P.atk/.28,0,1)+')';g.lineWidth=10;g.lineCap='round';g.beginPath();g.arc(w/2,h*.8,h*.4,-2.6+a*.8,-1.2+a*.8);g.stroke()}
 if(P.inv>.35){g.fillStyle='rgba(255,60,90,'+(P.inv-.35)*.9+')';g.fillRect(0,0,w,h)}
 if(sc.nt>.05)for(let i=0;i<22;i++){g.fillStyle='rgba(255,233,168,'+(sc.nt*(.5+.5*Math.sin(T*2+i)))+')';g.beginPath();g.arc(w*((i*.37+Math.sin(T*.2+i)*.05)%1),h*(.45+((i*.53+Math.cos(T*.15+i)*.05)%1)*.5),2,0,7);g.fill()}
 weather(w,h);if(mode=='play')hud(w,h)}

/* ---- first-person combat: yaw-based aim assist, combo, roll ---- */
function aim(){let b=null,bd=240;for(const e of ens){const dx=e.x-P.x,dy=e.y-P.y,d=hyp(dx,dy);if(d<bd&&Math.abs(angd(Math.atan2(dy,dx),P.yaw))<.95){bd=d;b=e}}if(b){P.yaw+=angd(Math.atan2(b.y-P.y,b.x-P.x),P.yaw)*.6;P.fx=Math.cos(P.yaw);P.fy=Math.sin(P.yaw)}}
function dodge(){if(P.st<25||P.roll>0)return;P.st-=25;hintDone('d');let ix=jp.on?jp.dx:(keys.d?1:0)-(keys.a?1:0)+(pad.mx||0),iy=jp.on?jp.dy:(keys.s?1:0)-(keys.w?1:0)+(pad.my||0);if(Math.abs(ix)<.1&&Math.abs(iy)<.1){ix=0;iy=-1}const fw=-iy,st=ix,dx=fw*P.fx-st*P.fy,dy=fw*P.fy+st*P.fx,l=hyp(dx,dy)||1;P.rx=dx/l;P.ry=dy/l;P.roll=.28;P.inv=.35;beep(200,.12,.04,'triangle')}
function attack(){if(P.cd>0||P.roll>0)return;hintDone('a');aim();P.cb=P.cbT>0?(P.cb+1)%3:0;P.cbT=1;const big=P.cb==2;P.cd=big?.5:.34;P.atk=big?.28:.2;beep(big?220:300,.1,.06,'triangle');
 const R=big?78:64,a0=Math.atan2(P.fy,P.fx);let hit=0;for(const e of ens.slice()){const dx=e.x-P.x,dy=e.y-P.y,d=hyp(dx,dy);if(d<R+e.t.r){let da=Math.abs(Math.atan2(dy,dx)-a0);if(da>Math.PI)da=2*Math.PI-da;if(da<(big?1.5:1.1)){hurtE(e,ST.atk*rnd(.9,1.3)*(big?1.8:1),P.x,P.y);hit=1}}}
 if(hit){SH=big?.2:.1;HS=big?.08:.04;if(big)pop(P.x,P.y-40,'HEAVY','#ffd98a')}}

/* ================= v0.3.1: lock-on and gamepad ================= */
function lockOn(){hintDone('z');if(P.lock){P.lock=null;return}let b=null,bd=520;for(const e of ens){const d=hyp(e.x-P.x,e.y-P.y);if(d<bd&&Math.abs(angd(Math.atan2(e.y-P.y,e.x-P.x),P.yaw))<1.3){bd=d;b=e}}P.lock=b;if(b)pop(b.x,b.y-40,'Locked','#ffd98a')}
function pad(dt){const gp=(navigator.getGamepads?navigator.getGamepads():[])[0];if(!gp){pad.mx=pad.my=0;return}
 const a=gp.axes||[],dz=v=>Math.abs(v)<.18?0:v,on=pad.on||(pad.on={}),edge=(i,id)=>{const p=gp.buttons[i]&&gp.buttons[i].pressed;if(p){if(!on[i]){on[i]=1;press(id)}}else on[i]=0};
 pad.mx=dz(a[0]||0);pad.my=dz(a[1]||0);P.yaw+=dz(a[2]||0)*2.6*dt;P.pitch=cl(P.pitch-dz(a[3]||0)*1.6*dt,-.45,.45);
 edge(0,'e');edge(1,'d');edge(2,'a');edge(3,'s');edge(4,'h');edge(5,'v');edge(7,'a');edge(11,'z');edge(10,'w');edge(9,'m');edge(8,'p')}

function fit(){DPR=Math.min(devicePixelRatio||1,3);cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px'}
addEventListener('resize',fit);fit();
function loop(ts){let dt=Math.min(.05,(ts-last)/1000||0);last=ts;perf(dt);T+=dt;SH=Math.max(0,SH-dt);try{if(mode=='play'){if(HS>0){HS-=dt;dt*=.25}upd(dt)}draw()}catch(e){console.error(e)}requestAnimationFrame(loop)}
title();
requestAnimationFrame(loop);

try{window.dispatchEvent(new Event('resize'));setTimeout(function(){window.dispatchEvent(new Event('resize'))},150);setTimeout(function(){window.dispatchEvent(new Event('resize'))},600)}catch(e){}

}catch(e){window.__fatal('Startup error',e,true)}});
